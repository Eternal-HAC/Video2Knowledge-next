name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          # 版本号唯一来源是 product_info.py（launcher/backend/构建脚本同读这一份）
          source = Path("product_info.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from product_info.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match product version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt "pyinstaller==6.22.3"

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $meta = Get-Content -LiteralPath product_info.py -Raw -Encoding UTF8
          $version = [regex]::Match($meta, '(?m)^VERSION = "([^"]+)"').Groups[1].Value
          $product = [regex]::Match($meta, '(?m)^PRODUCT_NAME = "([^"]+)"').Groups[1].Value
          if (-not $version -or -not $product) { throw "无法从 product_info.py 读取 VERSION / PRODUCT_NAME" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRODUCT_NAME=$product" >> $env:GITHUB_ENV

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath "dist\$env:PRODUCT_NAME-$env:VERSION-portable.exe"
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Value "$hash  $($exe.Name)" -Encoding ascii

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/${{ env.PRODUCT_NAME }}-${{ env.VERSION }}-portable.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Read product metadata
        run: |
          product=$(grep -m1 '^PRODUCT_NAME = ' product_info.py | cut -d'"' -f2)
          if [ -z "$product" ]; then echo "Could not read PRODUCT_NAME from product_info.py" >&2; exit 1; fi
          echo "PRODUCT_NAME=$product" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # heredoc 不带引号：正文里的 $ 必须写成 \$，否则 $$ 会被展开成 shell 进程号（v1.4.0 实测踩到）
          # tag 推送 -> 本工作流创建 prerelease；全程只有这一条发布命令，不与人工/其它步骤抢建
          NOTES=$(cat <<EOF
          ## $PRODUCT_NAME $GITHUB_REF_NAME

          Video2Knowledge 是 VideoToNo 的继任产品（Derived from VideoToNo v1.4.2）：本地 ASR 与文件保存在本机完成；调用云模型会发送转录内容，启用飞书会发送发布内容。仓库保留上游 Git 历史与 MIT License 归属，详见 UPSTREAM.md。

          本版本沿用 Video2Knowledge 的独立品牌与版本线（1.0.0-beta → rc → stable）：
          - Knowledge Studio 首屏直接提供六个内置模板、自定义模板、默认/自定义/Obsidian 本地 Markdown 目的地与可选飞书附加发布
          - 结果区明确提供“导出 Markdown”和 SRT、HTML、JSON、纯文本、PNG 等已有格式，不改变任务与导出 API
          - 品牌标志继续使用仓库脚本可复现生成的原创图形
          - 兼容迁移：/api/health 继续返回旧服务标识（同时携带 product 与 api_compat）；VIDEO2KNOWLEDGE_* 环境变量优先、旧名 VIDEOTONOTES_* 继续生效；浏览器偏好从 vtn_prefs 迁移到 v2k_prefs 并保留旧键；workspace 布局、MCP 工具与 Agent Skill 继续兼容
          - 视频下载、平台字幕与本地 ASR 等子系统沿用上游成熟实现，非本项目从零重写
          - 便携版 EXE：解压即用，下载后可用随附的 SHA256SUMS.txt 校验完整性

          验收边界（发布前必读）：
          - 打包态离线 ASR 验收是本版本发布前的独立验收项，结果以 PROJECT_STATUS.md 的记录为准
          - 上一阶段的真实链路证据仅限一条短合成字幕 + DeepSeek 单模型的笔记任务，不构成对其他 Provider、长视频、公开平台或网络环境的兼容保证
          - beta 版本可能存在未发现问题，欢迎到 Issues 反馈

          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "$PRODUCT_NAME $GITHUB_REF_NAME" --prerelease
